name: Feature
description: New capability
labels:
  - type:feature
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >-
        What the user gets and why it matters, in plain language.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        3–5 testable checkboxes: the success path and at least one edge case.
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: >-
        Proposed technical approach. A proposal, not a contract.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Why now, links, constraints. No copied code facts.
    validations:
      required: false
  - type: textarea
    id: qa
    attributes:
      label: QA
      description: >-
        How this will be checked, and which checks could fail.
    validations:
      required: true
