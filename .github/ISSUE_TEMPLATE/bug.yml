name: Bug
description: Something is broken
labels:
  - type:bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >-
        One sentence: what is wrong, where.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: >-
        What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: >-
        What happens instead. Paste errors and screenshots.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Device, OS version, build flavor and version.
    validations:
      required: true
