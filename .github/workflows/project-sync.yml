name: Project Sync

# Moves issues on this repository's GitHub Project as work progresses. Logic and rules live in
# scripts/project/project.mjs; AGENTS.md § Work tracking says which edge each writer owns.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: project-sync-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync project status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GITHUB_TOKEN cannot reach a user-owned project, so a classic token with the project and
      # repo scopes lives in PROJECT_TOKEN. Without it, skip instead of failing.
      - name: Check project token
        id: token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::notice::PROJECT_TOKEN is not set; project status was not synced."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts/project

      - name: Setup Node
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync project status
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/project/project.mjs sync
