name: Validate AI-Forward Standards

on:
  pull_request:
    paths:
      - 'lib/presentation/**'
      - 'lib/data/repositories/**'
      - 'lib/models/**'
      - 'lib/core/**'
      - 'scripts/generate_feature_manifests.dart'
      - 'lib/manifests/**'
      - 'test/**'
      - 'ios/**'
      - 'android/**'

jobs:
  unit-and-widget-tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: cp .env.example .env

      - name: Run unit and widget tests
        run: |
          echo "Running unit tests and widget tests..."
          flutter test --reporter expanded
          if [ $? -ne 0 ]; then
            echo "❌ Unit or widget tests failed!"
            echo ""
            echo "Please fix failing tests before merging."
            echo "If you modified:"
            echo "  - Models: Update tests in test/models/"
            echo "  - Repositories: Update tests in test/repositories/"
            echo "  - Controllers: Update tests in test/presentation/"
            echo "  - Views/Widgets: Update tests in test/presentation/ (e.g. *_view_test.dart, *_widget_test.dart)"
            exit 1
          fi
          echo "✅ All unit and widget tests passed"

  manifest-freshness:
    name: Manifest Freshness Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Generate manifests
        run: |
          echo "Generating feature manifests..."
          dart run scripts/generate_feature_manifests.dart
          if [ $? -ne 0 ]; then
            echo "❌ Failed to generate manifests"
            exit 1
          fi
          echo "✅ Manifest generation completed"

      - name: Check for uncommitted manifest changes
        id: check-manifests
        run: |
          # Ensure manifests directory exists
          if [ ! -d "lib/manifests" ]; then
            echo "❌ lib/manifests directory does not exist"
            exit 1
          fi
          
          # Install jq for JSON manipulation (to ignore timestamp differences)
          sudo apt-get update && sudo apt-get install -y jq
          
          # After generating manifests, check if any manifest files differ from what's committed in the PR
          # We compare the generated files against HEAD, ignoring the 'generatedAt' timestamp field
          echo "Checking for manifest changes against HEAD (ignoring timestamp)..."
          
          # Find all manifest files and check each one
          CHANGED_FILES=""
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              # Check if file is tracked in git
              if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
                # Compare files ignoring the 'generatedAt' timestamp field
                # Get the committed version from HEAD
                HEAD_CONTENT=$(git show HEAD:"$file" 2>/dev/null | jq 'del(.generatedAt)' 2>/dev/null)
                CURRENT_CONTENT=$(cat "$file" | jq 'del(.generatedAt)' 2>/dev/null)
          
                # Compare normalized content (without timestamp)
                if [ "$HEAD_CONTENT" != "$CURRENT_CONTENT" ]; then
                  if [ -z "$CHANGED_FILES" ]; then
                    CHANGED_FILES="$file"
                  else
                    CHANGED_FILES="$CHANGED_FILES"$'\n'"$file"
                  fi
                  # Show a sample diff for the first file to help debug
                  if [ "$(echo "$CHANGED_FILES" | wc -l)" -eq 1 ]; then
                    echo ""
                    echo "Sample diff for $file (ignoring timestamp):"
                    echo "--- HEAD version (without timestamp)"
                    echo "$HEAD_CONTENT" | head -10
                    echo "--- Current version (without timestamp)"
                    echo "$CURRENT_CONTENT" | head -10
                    echo ""
                  fi
                fi
              else
                # File is untracked (new file) - this is okay, manifests can be new
                echo "  ℹ️  $file is a new file (untracked) - this is okay"
              fi
            fi
          done < <(find lib/manifests -name "*.manifest.generated.json" -type f | sort)
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "❌ Manifests are out of date!"
            echo ""
            echo "The following manifest files differ from what's committed in this PR:"
            echo "$CHANGED_FILES" | while IFS= read -r file; do
              echo "  - $file"
            done
            echo ""
            echo "This means the code structure changed but manifests weren't regenerated."
            echo ""
            echo "Please run: dart run scripts/generate_feature_manifests.dart"
            echo "Then commit the updated manifests."
            exit 1
          else
            echo "✅ All manifests are up to date"
          fi

  import-rules:
    name: Import Rules Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for relative imports
        id: check-imports
        run: |
          # Find relative imports, excluding generated files
          # Check for both '../' and '../../' patterns with single or double quotes
          RELATIVE_IMPORTS=$(grep -rE "import ['\"]\.\./" lib/ --include="*.dart" | grep -v ".g.dart" | grep -v ".freezed.dart" || true)
          
          if [ -n "$RELATIVE_IMPORTS" ]; then
            echo "❌ Relative imports found!"
            echo ""
            echo "The following files contain relative imports (use absolute package imports instead):"
            echo "$RELATIVE_IMPORTS" | while IFS= read -r line; do
              echo "  - $line"
            done
            echo ""
            echo "All imports must use absolute package paths: package:riverpod_template/..."
            exit 1
          else
            echo "✅ No relative imports found"
          fi

  file-size:
    name: File Size Guidelines
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file sizes
        id: check-sizes
        run: |
          VIOLATIONS=()
          
          # Check views (≤250 lines)
          while IFS= read -r file; do
            LINES=$(wc -l < "$file" | tr -d ' ')
            if [ "$LINES" -gt 250 ]; then
              VIOLATIONS+=("$file ($LINES lines) - exceeds 250 line limit")
            fi
          done < <(find lib/presentation -name "*_view.dart" -type f ! -name "*.g.dart" ! -name "*.freezed.dart")
          
          # Check controllers (≤150 lines)
          while IFS= read -r file; do
            LINES=$(wc -l < "$file" | tr -d ' ')
            if [ "$LINES" -gt 150 ]; then
              VIOLATIONS+=("$file ($LINES lines) - exceeds 150 line limit")
            fi
          done < <(find lib/presentation -name "*_controller.dart" -type f ! -name "*.g.dart" ! -name "*.freezed.dart")
          
          # Check repositories (≤200 lines)
          while IFS= read -r file; do
            LINES=$(wc -l < "$file" | tr -d ' ')
            if [ "$LINES" -gt 200 ]; then
              VIOLATIONS+=("$file ($LINES lines) - exceeds 200 line limit")
            fi
          done < <(find lib/data/repositories -name "*_repository.dart" -type f ! -name "*.g.dart" ! -name "*.freezed.dart")
          
          # Check widgets (≤100 lines)
          while IFS= read -r file; do
            LINES=$(wc -l < "$file" | tr -d ' ')
            if [ "$LINES" -gt 100 ]; then
              VIOLATIONS+=("$file ($LINES lines) - exceeds 100 line limit")
            fi
          done < <(find lib/presentation -name "*_widget.dart" -type f ! -name "*.g.dart" ! -name "*.freezed.dart")
          
          # Check models (≤100 lines)
          while IFS= read -r file; do
            LINES=$(wc -l < "$file" | tr -d ' ')
            if [ "$LINES" -gt 100 ]; then
              VIOLATIONS+=("$file ($LINES lines) - exceeds 100 line limit")
            fi
          done < <(find lib/models -name "*_model.dart" -type f ! -name "*.g.dart" ! -name "*.freezed.dart")
          
          if [ ${#VIOLATIONS[@]} -gt 0 ]; then
            echo "⚠️  Found ${#VIOLATIONS[@]} file(s) exceeding size guidelines"
            echo ""
            for violation in "${VIOLATIONS[@]}"; do
              echo "  - $violation"
            done
            echo ""
            echo "Guidelines:"
            echo "  - Views: ≤250 lines"
            echo "  - Controllers: ≤150 lines"
            echo "  - Repositories: ≤200 lines"
            echo "  - Widgets/Models: ≤100 lines"
          else
            echo "✅ All files are within size guidelines"
          fi

  code-standards:
    name: Code Standards Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for dynamic type usage
        id: check-dynamic
        run: |
          # Find dynamic type usage, excluding generated files and test files
          DYNAMIC_USAGE=$(grep -r ":\s*dynamic" lib/ --include="*.dart" | grep -v ".g.dart" | grep -v ".freezed.dart" | grep -v "/test/" || true)
          
          if [ -n "$DYNAMIC_USAGE" ]; then
            echo "❌ 'dynamic' type usage found!"
            echo ""
            echo "The following files contain 'dynamic' types (use specific types instead):"
            echo "$DYNAMIC_USAGE" | while IFS= read -r line; do
              echo "  - $line"
            done
            echo ""
            echo "Replace 'dynamic' with specific types for better type safety."
            exit 1
          else
            echo "✅ No 'dynamic' type usage found"
          fi

      - name: Check for private _build methods
        id: check-build-methods
        run: |
          # Find private _build methods, excluding generated files
          BUILD_METHODS=$(grep -r "Widget _build" lib/presentation/ --include="*.dart" | grep -v ".g.dart" || true)
          
          if [ -n "$BUILD_METHODS" ]; then
            echo "❌ Private _build methods found!"
            echo ""
            echo "The following files contain private _build methods (extract to separate widget classes):"
            echo "$BUILD_METHODS" | while IFS= read -r line; do
              echo "  - $line"
            done
            echo ""
            echo "Extract these methods into separate widget classes instead of using same-file private methods."
            exit 1
          else
            echo "✅ No private _build methods found"
          fi

  config-file-integrity:
    name: Config File Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate iOS plist files
        run: |
          echo "Validating iOS plist files..."
          ERRORS=""
          CHECKED=0

          while IFS= read -r file; do
            CHECKED=$((CHECKED + 1))

            # 1) XML well-formedness check via xmllint
            XMLLINT_ERR=$(xmllint --noout "$file" 2>&1) || {
              ERRORS="${ERRORS}❌ ${file} (XML syntax error):\n   ${XMLLINT_ERR}\n\n"
              continue
            }

            # 2) Plist structure check via Python plistlib
            PLIST_ERR=$(python3 -c "
          import plistlib, sys
          try:
              with open(sys.argv[1], 'rb') as f:
                  plistlib.load(f)
          except Exception as e:
              print(str(e), file=sys.stderr)
              sys.exit(1)
          " "$file" 2>&1) || {
              ERRORS="${ERRORS}❌ ${file} (plist structure error):\n   ${PLIST_ERR}\n\n"
            }
          done < <(find ios -name "*.plist" -type f 2>/dev/null)

          if [ "$CHECKED" -eq 0 ]; then
            echo "⚠️  No plist files found in ios/ — skipping"
            exit 0
          fi

          if [ -n "$ERRORS" ]; then
            echo ""
            echo "========================================="
            echo "  PLIST VALIDATION FAILED"
            echo "========================================="
            echo ""
            echo -e "$ERRORS"
            echo "Common AI-introduced issues:"
            echo "  - Stray line breaks inside <string>, <key>, or other XML tags"
            echo "  - Accidental whitespace in tag values"
            echo "  - Missing or mismatched closing tags"
            echo "  - Invalid XML entities or characters"
            echo ""
            echo "To verify locally: xmllint --noout <file>"
            echo "Or on macOS:       plutil -lint <file>"
            exit 1
          fi
          echo "✅ All $CHECKED plist files are valid"

      - name: Validate Android XML files
        run: |
          echo "Validating Android XML config files..."
          ERRORS=""
          CHECKED=0

          # Validate AndroidManifest.xml files
          while IFS= read -r file; do
            CHECKED=$((CHECKED + 1))
            XMLLINT_ERR=$(xmllint --noout "$file" 2>&1) || {
              ERRORS="${ERRORS}❌ ${file}:\n   ${XMLLINT_ERR}\n\n"
            }
          done < <(find android -name "AndroidManifest.xml" -type f 2>/dev/null)

          # Validate other Android XML resources that AI might touch
          while IFS= read -r file; do
            CHECKED=$((CHECKED + 1))
            XMLLINT_ERR=$(xmllint --noout "$file" 2>&1) || {
              ERRORS="${ERRORS}❌ ${file}:\n   ${XMLLINT_ERR}\n\n"
            }
          done < <(find android/app/src -name "*.xml" -path "*/res/*" -type f 2>/dev/null)

          if [ "$CHECKED" -eq 0 ]; then
            echo "⚠️  No Android XML files found — skipping"
            exit 0
          fi

          if [ -n "$ERRORS" ]; then
            echo ""
            echo "========================================="
            echo "  ANDROID XML VALIDATION FAILED"
            echo "========================================="
            echo ""
            echo -e "$ERRORS"
            echo "Common AI-introduced issues:"
            echo "  - Stray line breaks inside XML attributes or tag values"
            echo "  - Missing closing tags or self-closing syntax"
            echo "  - Invalid XML entities or malformed namespace declarations"
            echo ""
            echo "To verify locally: xmllint --noout <file>"
            exit 1
          fi
          echo "✅ All $CHECKED Android XML files are valid"

      - name: Check for common AI corruption patterns
        run: |
          echo "Checking for common AI corruption patterns in config files..."
          WARNINGS=""

          # Check for line breaks inside XML tag attributes (common AI mistake)
          # Pattern: an opening tag that spans multiple lines with broken attributes
          while IFS= read -r file; do
            # Check for broken string values in plist (line break inside <string>...</string>)
            # A valid plist <string> should not contain raw newlines between open/close tags
            # unless it's intentionally multiline content
            BROKEN_STRINGS=$(python3 -c "
          import re, sys
          with open(sys.argv[1], 'r') as f:
              content = f.read()
          # Find <string> tags where the value contains a newline but the tag
          # is clearly a single-value field (short content split across lines)
          pattern = r'<string>([^<]*\n[^<]*)</string>'
          matches = re.finditer(pattern, content)
          for m in matches:
              val = m.group(1).strip()
              # Skip intentionally multiline values (very long content)
              if len(val) < 200:
                  line_num = content[:m.start()].count('\n') + 1
                  print(f'  Line {line_num}: <string> value contains line break: \"{val[:80]}...\"')
          " "$file" 2>/dev/null) || true

            if [ -n "$BROKEN_STRINGS" ]; then
              WARNINGS="${WARNINGS}⚠️  ${file} — possible broken string values:\n${BROKEN_STRINGS}\n\n"
            fi
          done < <(find ios -name "*.plist" -type f 2>/dev/null)

          if [ -n "$WARNINGS" ]; then
            echo ""
            echo "========================================="
            echo "  POTENTIAL CONFIG CORRUPTION DETECTED"
            echo "========================================="
            echo ""
            echo -e "$WARNINGS"
            echo "These may be false positives, but are worth reviewing."
            echo "AI models sometimes split single-line values across multiple lines."
            exit 1
          fi
          echo "✅ No common AI corruption patterns detected"

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [ unit-and-widget-tests, manifest-freshness, import-rules, code-standards, config-file-integrity ]
    if: always()

    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.unit-and-widget-tests.result }}" != "success" ] || \
             [ "${{ needs.manifest-freshness.result }}" != "success" ] || \
             [ "${{ needs.import-rules.result }}" != "success" ] || \
             [ "${{ needs.code-standards.result }}" != "success" ] || \
             [ "${{ needs.config-file-integrity.result }}" != "success" ]; then
            echo "❌ Some validation checks failed. Please review the errors above."
            echo ""
            echo "Results:"
            echo "  - Unit & Widget Tests: ${{ needs.unit-and-widget-tests.result }}"
            echo "  - Manifest Freshness: ${{ needs.manifest-freshness.result }}"
            echo "  - Import Rules: ${{ needs.import-rules.result }}"
            echo "  - Code Standards: ${{ needs.code-standards.result }}"
            echo "  - Config File Integrity: ${{ needs.config-file-integrity.result }}"
            exit 1
          else
            echo "✅ All blocking validation checks passed!"
          fi
